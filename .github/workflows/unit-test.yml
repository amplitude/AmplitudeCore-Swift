name: Unit Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  unit-test:
    name: Unit ${{ matrix.platform }} - Xcode ${{ matrix.xcode }} - OS ${{ matrix.test-destination-os }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        # Keep the compiler at the release baseline while testing two OS generations.
        # macos-15 retains the older runtimes; macos-26 also covers the newer host OS.
        # Pin simulator versions: OS=latest can fail to resolve a destination.
        include:
          - platform: iOS
            runner: macos-15
            xcode: "26.0"
            test-destination-os: "18.5"
            device: "iPhone 16"

          - platform: iOS
            runner: macos-26
            xcode: "26.0"
            test-destination-os: "26.0.1"
            device: "iPhone 17"

          - platform: macOS
            runner: macos-15
            xcode: "26.0"
            test-destination-os: "15"

          - platform: macOS
            runner: macos-26
            xcode: "26.0"
            test-destination-os: "26"

          - platform: tvOS
            runner: macos-15
            xcode: "26.0"
            test-destination-os: "18.5"
            device: "Apple TV"

          - platform: tvOS
            runner: macos-26
            xcode: "26.0"
            test-destination-os: "26.0"
            device: "Apple TV"

          - platform: watchOS
            runner: macos-15
            xcode: "26.0"
            test-destination-os: "11.5"
            device: "Apple Watch Series 10 (42mm)"

          - platform: watchOS
            runner: macos-26
            xcode: "26.0"
            test-destination-os: "26.0"
            device: "Apple Watch Series 11 (42mm)"

          - platform: visionOS
            runner: macos-15
            xcode: "26.0"
            test-destination-os: "2.5"
            device: "Apple Vision Pro"

          - platform: visionOS
            runner: macos-26
            xcode: "26.0"
            test-destination-os: "26.0"
            device: "Apple Vision Pro"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Install Apple platform SDKs
        run: |
          # Warm up CoreSimulator to avoid "Unable to connect to simulator":
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3239326872
          xcrun simctl list > /dev/null
          case "${{ matrix.platform }}" in
            iOS)
              sudo xcodebuild -downloadPlatform iOS
              ;;
            tvOS)
              sudo xcodebuild -downloadPlatform tvOS
              ;;
            watchOS)
              sudo xcodebuild -downloadPlatform watchOS
              ;;
            visionOS)
              sudo xcodebuild -downloadPlatform visionOS
              ;;
          esac
      - name: ${{ matrix.platform }} Tests
        run: |
          case "${{ matrix.platform }}" in
            iOS)
              xcodebuild test \
                -scheme AmplitudeCore-Package \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}'
              ;;
            macOS)
              xcodebuild test \
                -scheme AmplitudeCore-Package \
                -sdk macosx \
                -destination 'platform=macOS'
              ;;
            tvOS)
              xcodebuild \
                -scheme AmplitudeCore-Package \
                -sdk appletvsimulator \
                -destination 'platform=tvOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
            watchOS)
              xcodebuild \
                -scheme AmplitudeCore-Package \
                -sdk watchsimulator \
                -destination 'platform=watchOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
            visionOS)
              xcodebuild \
                -scheme AmplitudeCore-Package \
                -sdk xrsimulator \
                -destination 'platform=visionOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
          esac
